
name: Build Alok Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Alok Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Locate Android Project
        id: locate
        run: |
          FILE=$(find . -type f -name settings.gradle.kts \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build APK
        id: build
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug
          echo "apk_path=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alok-Companion-APK
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
